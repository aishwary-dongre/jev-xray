[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-xray"
version = "0.1.0"
description = "Decision forensics for System One models: which part of the input caused this decision, and is the question safe to threshold on."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aishwary Dongre", email = "dongreaishwary@gmail.com" }]
keywords = [
    "jev",
    "typesafe",
    "system-one",
    "interpretability",
    "explainability",
    "attribution",
    "shapley",
    "prompt-injection",
    "xai",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: Pytest",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/aishwary-dongre/jev-xray"
Source = "https://github.com/aishwary-dongre/jev-xray"
Demo = "https://aishwary-dongre.github.io/jev-xray/"
Issues = "https://github.com/aishwary-dongre/jev-xray/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
jev-xray = "jev_xray.cli:main"

# Registers the `jev` fixture and the assert_ helpers. The fixture skips unless
# an endpoint is configured, so installing this package never makes an existing
# suite start calling out to a model.
[project.entry-points.pytest11]
jev_xray = "jev_xray.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_xray"]

[tool.hatch.build.targets.sdist]
# The examples are referenced by the README and by CI, and the tests are how
# anyone packaging this downstream verifies it. Both belong in the sdist.
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes: genuine mistakes
    "E",
    "W",
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",
    "C4",
    "ISC",
    "PIE",
    "RUF",
]

ignore = [
    # Our error messages are deliberately long and actionable. "raise a bare
    # exception and put the detail elsewhere" is the opposite of what this
    # package is for: a budget error that names the knob to turn is the feature.
    "TRY003",
    # Assigning a long message to a variable first, for the same reason.
    "EM101",
    "EM102",
    # __all__ is grouped by concern with comments -- questions, probes,
    # segmentation, plumbing, rendering -- which reads better than alphabetical
    # and is the order someone exploring the package wants.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # Shared fixtures as class attributes are idiomatic in a test class and are
    # never mutated. Annotating each with ClassVar is noise here.
    "RUF012",
]

[tool.mypy]
python_version = "3.11"
files = ["src/jev_xray"]
# Not strict. Most of this package is annotated, but the probe and estimator
# results are deliberately duck-typed so one renderer can handle either
# estimator, and forcing a Protocol on that would cost more clarity than it buys.
# These settings catch the errors that bite without demanding total coverage.
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
