name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Test
        # Every test runs against the deterministic fake, so the suite needs no
        # API key and makes no network calls. If that ever stops being true this
        # job is where it will show up.
        run: python -m pytest -q

  package:
    # Building is not the same as being installable. This checks the artifact a
    # stranger would actually get: no source tree on the path, no editable
    # install, no dev extras.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl

      - name: It works from the installed package
        working-directory: /tmp
        run: |
          /tmp/clean/bin/jev-xray demo --no-color > /dev/null
          /tmp/clean/bin/python - <<'PY'
          from importlib.metadata import version
          import jev_xray
          declared, reported = version("jev-xray"), jev_xray.__version__
          assert declared == reported, f"{declared} packaged, {reported} reported"
          assert jev_xray.XRay and jev_xray.to_html
          print(f"ok: jev-xray {reported} installs and runs from the wheel")
          PY

      - name: The license ships with it
        run: |
          python - <<'PY'
          import zipfile, glob
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("LICENSE") for n in names), names
          print("ok: LICENSE is in the wheel")
          PY

  smoke:
    # The first thing anyone does with this repo is run the demo. If that breaks,
    # the tests passing is not much comfort.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Offline demo runs
        run: jev-xray demo --no-color

      - name: Injection scenario runs and flags the planted attack
        run: |
          jev-xray demo --scenario injection --json > injection.json
          python - <<'PY'
          import json, sys
          report = json.load(open("injection.json"))
          top = report["segments"][0]
          assert top["label"] == "user_message", f"expected the injected field on top, got {top['label']}"
          assert top["effect"] > 0, "the injection should push toward 'safe'"
          print(f"ok: {top['label']} at {top['effect']:+.4f}")
          PY

      - name: Every estimator runs
        run: |
          for method in loo shapley deep; do
            echo "--- $method ---"
            jev-xray explain examples/ticket.json -q refund_requested \
              --fake --segmenter sentence --method "$method" --no-color > /dev/null
          done

      - name: Stability suite runs and reports a verdict
        # Exits 1 on an unusable question, which the signal-free fake is by
        # construction, so the exit code is expected rather than a failure.
        run: |
          jev-xray stability examples/ticket.json -q refund_requested \
            --fake --segmenter sentence || true

      - name: Version diff runs over a corpus
        # The fake answers the same regardless of the model name, so this
        # exercises the plumbing and the report shape rather than a real flip.
        # Flips are covered by unit tests with two differently configured fakes.
        run: |
          jev-xray diff examples/corpus.json --fake \
            --baseline fake-v1 --candidate fake-v2 --json > diff.json
          python - <<'PY'
          import json
          report = json.load(open("diff.json"))
          assert report["states"] == 8, report["states"]
          assert len(report["questions"]) == 3
          # Two requests per state, regardless of the question count.
          assert report["cost"]["requests"] == 16, report["cost"]["requests"]
          print("ok: 8 states, 3 questions, 16 requests")
          PY

      - name: Both HTML reports generate and carry no scripts
        # These pages are rendered from state the caller may not trust and then
        # opened in a browser, so script-free is a property worth enforcing in CI
        # rather than hoping for.
        run: |
          jev-xray demo --html attribution.html
          jev-xray stability examples/ticket.json -q refund_requested \
            --fake --segmenter sentence --html stability.html || true
          for page in attribution.html stability.html; do
            test -s "$page" || { echo "$page was not written"; exit 1; }
            if grep -qi "<script" "$page"; then
              echo "$page contains a script tag"
              exit 1
            fi
          done
          echo "ok: both reports written, neither contains a script tag"
